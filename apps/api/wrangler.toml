name = "tapestrai-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
# SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY are secrets.
# Local: put them in apps/api/.dev.vars (gitignored).
# Deployed: `wrangler secret put <NAME>` for each one.

[dev]
port = 4000

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
