<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandate Target Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: entity rail | hierarchy grid | assigned-targets summary. Single dark institutional theme. */
:root{
  --bg:#0d1117; --panel:#141a22; --panel-2:#1a212b; --line:#242d39; --line-2:#2f3a48;
  --text:#dbe1e8; --muted:#8693a4; --faint:#5b6778;
  --accent:#6aa5e0; --accent-dim:rgba(106,165,224,.14);
  --ok:#4fb286; --warn:#d9a441; --bad:#e0716c;
  --font-display:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font-body);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-rows:48px 1fr;height:100%}
header.top{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:600 15px var(--font-display);letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;color:var(--muted);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-dim);color:var(--text)}
.spacer{flex:1}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:5px 10px;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1520;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.body{display:grid;grid-template-columns:256px minmax(0,1fr) 300px;min-height:0}
.body.noside{grid-template-columns:256px minmax(0,1fr)}
.body.noside .side{display:none}
/* Rail */
.rail{border-right:1px solid var(--line);overflow:auto;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.rail h2,.side h2{font:600 11px var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 8px 8px}
.ent{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;align-items:center;padding:7px 8px;border-radius:6px;border:1px solid transparent;background:none;text-align:left;width:100%}
.ent:hover{background:var(--panel-2)}
.ent[aria-current="true"]{background:var(--accent-dim);border-color:rgba(106,165,224,.35)}
.ent .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent.client .nm{font-weight:600}
.ent.mandate{padding-left:22px}
.ent .sub{grid-column:1/-1;color:var(--muted);font:11px var(--font-mono);display:flex;gap:8px;align-items:center}
.lensbars{display:inline-flex;gap:3px;margin-left:auto}
.lensbars i{display:block;width:16px;height:4px;border-radius:2px;background:var(--line-2)}
.lensbars i.on{background:var(--accent)}
.count{font:500 11px var(--font-mono);color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 7px}
.ent[aria-current="true"] .count{color:var(--text)}
.rail .add{margin:10px 8px 0}
/* Main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.ehead{padding:14px 20px 0;min-width:0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.crumb{color:var(--muted);font-size:12px}
.etitle{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.etitle h1{font:600 22px/1.1 var(--font-display);margin:0;text-wrap:balance}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column}
.kpi b{font:500 15px var(--font-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted)}
.eactions{display:flex;gap:8px;align-items:center;margin-left:auto}
.lbl{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 9px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.tab b{font:600 13px var(--font-display);letter-spacing:.02em;color:inherit}
.tab small{font-size:10.5px;color:var(--faint)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab .count{margin-left:6px}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:5px 10px;width:220px}
.chk-toggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted);user-select:none}
.chk-toggle input{accent-color:var(--accent)}
.hint{color:var(--faint);font-size:11px;margin-left:auto}
.gridwrap{flex:1;overflow:auto;min-height:0}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px}
.grid th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;font:600 11px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.grid th.num{text-align:right}
.grid td{border-bottom:1px solid var(--line);padding:0;height:34px;vertical-align:middle}
.grid tr:hover td{background:rgba(255,255,255,.015)}
.grid tr.has td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.grid tr.flash td{animation:flash 1.2s ease-out}
@keyframes flash{from{background:rgba(106,165,224,.25)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.grid tr.flash td{animation:none;background:var(--accent-dim)}}
.namecell{display:flex;align-items:center;gap:6px;padding:0 10px;min-width:280px;min-height:52px}
.chev{width:20px;height:20px;border:0;background:none;color:var(--muted);border-radius:4px;display:grid;place-items:center;flex:none;padding:0}
.chev:hover{background:var(--panel-2);color:var(--text)}
.chev svg{transition:transform .12s}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.chev.leaf{visibility:hidden}
.tag{font:500 9.5px var(--font-mono);letter-spacing:.04em;color:var(--faint);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;flex:none}
.nm2{white-space:nowrap}
tr.root .nm2{font-weight:600}
tr.d1 .nm2{font-weight:500}
.below{font:11px var(--font-mono);color:var(--accent);background:var(--accent-dim);border-radius:9px;padding:0 6px;white-space:nowrap}
.match{background:rgba(217,164,65,.28);border-radius:2px}
input.cell{width:100%;height:33px;background:transparent;border:0;border-left:1px solid var(--line);padding:0 10px;text-align:right;font:13px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text)}
input.cell::placeholder{color:var(--faint);font-style:italic}
input.cell:hover{background:rgba(106,165,224,.06)}
input.cell:focus{background:var(--panel-2);outline:1px solid var(--accent);outline-offset:-1px}
input.cell.err{outline:1px solid var(--bad);background:rgba(224,113,108,.1)}
input.cell:disabled{color:var(--muted)}
td.w-usd{width:128px} td.w-n{width:90px} td.w-pct{width:96px}
td.sum,td.cmp{padding:0 10px;border-left:1px solid var(--line);white-space:nowrap;font:11.5px var(--font-mono);color:var(--muted)}
td.sum{width:150px} td.cmp{width:150px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:9px;padding:1px 7px;font:500 11px var(--font-mono);border:1px solid}
.pill.ok{color:var(--ok);border-color:rgba(79,178,134,.4)}
.pill.under{color:var(--warn);border-color:rgba(217,164,65,.4)}
.pill.over{color:var(--bad);border-color:rgba(224,113,108,.45)}
.pill+.pill{margin-left:4px}
td.act{width:34px;border-left:1px solid var(--line);text-align:center}
.clr{border:0;background:none;color:var(--faint);width:26px;height:26px;border-radius:4px;opacity:0}
tr:hover .clr,tr:focus-within .clr{opacity:1}
.clr:hover{color:var(--bad);background:var(--panel-2)}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* Side summary */
.side{border-left:1px solid var(--line);overflow:auto;padding:12px 10px;background:var(--panel)}
.side .grp{margin:0 0 18px}
.side .gh{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;border-bottom:1px solid var(--line-2);padding:6px 6px 6px 10px;margin:0;font:600 15px var(--font-display);letter-spacing:.02em;color:var(--text);text-align:left;box-shadow:inset 3px 0 0 var(--accent)}
.side .gh:hover{color:var(--accent)}
.side .gh small{color:var(--muted);font:500 11px var(--font-mono)}
.side .gpath{font-size:10.5px;color:var(--faint);margin:4px 6px 6px 10px}
.srow{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:4px 6px 4px calc(10px + var(--ind,0px));position:relative}
.srow:hover{background:var(--panel-2)}
.srow:not(.d1)::before{content:"";position:absolute;left:calc(var(--ind) - 2px);top:0;bottom:0;border-left:1px solid var(--line-2)}
.srow .l{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.srow .l b{font-weight:400;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.d1 .l b{font-weight:500;font-size:13px}
.srow.ctx .l b{color:var(--muted)}
.srow .nt{color:var(--faint);font-style:italic}
.vals{font:11.5px var(--font-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.vals em{font-style:normal;color:var(--text)}
.side .none{color:var(--faint);font-size:12px;margin:0 6px}
.legend{margin:16px 6px 0;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;gap:6px}
/* Overview */
.ov{flex:1;overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:22px}
.ov h1{font:600 22px var(--font-display);margin:0}
.ov h3{font:600 13px var(--font-display);letter-spacing:.03em;margin:0 0 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ov p.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.tbl{border-collapse:separate;border-spacing:0;width:100%}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font:600 11px var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel);position:sticky;top:0}
.tbl th.num,.tbl td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tbl tr.c td:first-child{font-weight:600}
.tbl tr.m td:first-child{padding-left:26px}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--panel-2)}
.mx th .pp{display:block;font:400 10px var(--font-body);text-transform:none;letter-spacing:0;color:var(--faint)}
.mx th{white-space:normal;min-width:92px;vertical-align:bottom}
.mx td.v{cursor:pointer;font-family:var(--font-mono);text-align:right}
.mx td.v:hover{background:var(--accent-dim)}
.mx td.v.imp{color:var(--muted);font-style:italic}
.mx td.v.nil{color:var(--faint)}
.covbar{display:inline-flex;align-items:center;gap:6px;font:11px var(--font-mono);color:var(--muted)}
.covbar i{display:inline-block;height:6px;background:var(--accent);border-radius:3px}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
select.sel{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px}
/* Min / target / max cells with band progress */
.grid td.m{width:232px;border-left:1px solid var(--line);padding:4px 8px 5px;height:auto}
.grid th.mh{border-left:1px solid var(--line);padding:6px 8px}
.grid th.mh b{display:block;font-weight:600}
.grid th.mh span{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:4px;margin-top:2px;font:500 9.5px var(--font-mono);letter-spacing:.04em;color:var(--faint)}
.grid th.mh span i{font-style:normal;text-align:right}
.trio{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:4px}
.trio input.cell{height:24px;border:1px solid transparent;border-radius:4px;padding:0 4px;font-size:12px;min-width:0}
.trio input.cell.mm{color:var(--muted);font-size:11px}
.trio input.cell.tgt{color:var(--text);font-weight:500;border-color:var(--line)}
.trio input.cell.mm::placeholder{font-style:normal;color:var(--line-2)}
.trio input.cell:hover{border-color:var(--line-2)}
.band{display:flex;align-items:center;gap:6px;margin-top:4px;height:12px}
.band .trk{position:relative;flex:1;height:6px;border-radius:3px;background:var(--panel-2);overflow:visible}
.band .rng{position:absolute;top:-2px;bottom:-2px;background:rgba(106,165,224,.16);border:1px solid rgba(106,165,224,.38);border-radius:3px}
.band .fill{position:absolute;left:0;top:1px;bottom:1px;border-radius:2px;background:var(--faint)}
.band .tg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px}
.band .av{font:11px var(--font-mono);color:var(--muted);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.band .av.nil{color:var(--faint)}
.st-in .fill,.st-at .fill{background:var(--ok)} .st-in .av,.st-at .av{color:var(--ok)}
.st-below .fill{background:var(--warn)} .st-below .av{color:var(--warn)}
.st-above .fill,.st-over .fill{background:var(--bad)} .st-above .av,.st-over .av{color:var(--bad)}
.st-under .fill{background:var(--accent)}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--line-2)}
.sdot.st-in,.sdot.st-at{background:var(--ok)} .sdot.st-below{background:var(--warn)} .sdot.st-above,.sdot.st-over{background:var(--bad)} .sdot.st-under{background:var(--accent)}
.srow .rgl{display:block;font:10.5px var(--font-mono);color:var(--faint);margin-top:1px;padding-left:13px}
.rgs{display:block;font-size:10px;color:var(--faint);font-style:normal}
.grid td.nm-td,.grid th.nm-td{position:sticky;left:0;z-index:1;background:var(--bg)}
.grid th.nm-td{z-index:3;background:var(--panel)}
.grid tr:hover td.nm-td{background:#11161d}
/* Compliance */
.ctiles{display:flex;gap:10px;flex-wrap:wrap}
.ctile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:118px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-align:left;color:var(--text)}
.ctile b{font:500 22px var(--font-mono)}
.ctile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-display);font-weight:600}
.ctile.on{outline:2px solid var(--accent);outline-offset:-1px}
.ctile.bad b{color:var(--bad)} .ctile.soft b{color:#e8935a} .ctile.warn b{color:var(--warn)} .ctile.pend b{color:var(--accent)} .ctile.ok b{color:var(--ok)}
.ctile.plain{cursor:default}
.cpill{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 7px;font:600 10.5px var(--font-display);letter-spacing:.05em;text-transform:uppercase;border:1px solid;white-space:nowrap;background:none}
.cpill.sm{font-size:9.5px;padding:0 5px}
button.cpill{cursor:pointer}
.cpill.ok{color:var(--ok);border-color:rgba(79,178,134,.45)} .cpill.bad{color:#fff;background:rgba(224,113,108,.85);border-color:var(--bad)}
.cpill.soft{color:#e8935a;border-color:rgba(232,147,90,.6)} .cpill.warn{color:var(--warn);border-color:rgba(217,164,65,.5)}
.cpill.pend{color:var(--accent);border-color:rgba(106,165,224,.5)} .cpill.na{color:var(--faint);border-color:var(--line-2)}
.cpill+.cpill{margin-left:4px}
.ctool{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rtbl td{vertical-align:middle}
.rtbl .sel{width:28px;padding-right:0} .rtbl .sel input{accent-color:var(--accent)}
.rtbl td.rn{white-space:normal;min-width:260px}
.rtbl td.rn{display:flex;gap:6px;align-items:flex-start}
.rtbl td.rn span{display:flex;flex-direction:column}
.rtoggle{border:0;background:none;color:var(--muted);width:20px;height:20px;padding:0;border-radius:4px;display:grid;place-items:center;flex:none}
.rtoggle svg{transition:transform .12s} .rtoggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.gapnote{font-size:10.5px;color:var(--bad);margin-top:1px}
.sev{font:600 10px var(--font-display);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line-2);background:none;color:var(--text);border-radius:4px;padding:2px 6px}
.sev.soft{color:#e8935a;border-color:rgba(232,147,90,.5)}
.req{font:12px var(--font-mono);color:var(--muted);white-space:nowrap}
.req.muted{color:var(--faint)}
.rin{background:var(--bg);border:1px solid var(--line-2);border-radius:4px;padding:3px 6px;color:var(--text);font:12px var(--font-mono);text-align:right}
.rin:focus{outline:1px solid var(--accent)}
.rin.err{border-color:var(--bad)}
.lnk{background:none;border:0;color:var(--accent);padding:0;font:inherit;text-decoration:underline}
.res{color:var(--text)}
.neg{color:var(--bad)}
.dimc{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.fcol{white-space:nowrap}
.fchip{display:inline-block;font:500 10px var(--font-mono);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;margin-right:3px;color:var(--muted)}
.fchip.gap{border-style:dashed;border-color:rgba(224,113,108,.7);color:var(--bad)}
.fchip.plan{border-style:dashed;border-color:rgba(106,165,224,.7);color:var(--accent)}
.fchip.mctx{color:var(--faint)}
.rtbl tr.rrow.open td{background:var(--panel)}
.rtbl tr:hover .clr{opacity:1}
tr.rdetail td{background:var(--panel);padding:4px 14px 16px}
.rdgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px}
.rdh{font:600 11px var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 6px}
.rdp{margin:0 0 6px;color:var(--muted);font-size:12px;white-space:normal;max-width:60ch}
.warn-t{color:var(--warn);text-transform:none;letter-spacing:0;font-weight:500}
.drow{display:grid;grid-template-columns:minmax(140px,1.4fr) minmax(120px,2fr) 70px minmax(90px,auto) auto;gap:10px;align-items:center;padding:3px 0;font-size:12px;border-bottom:1px solid var(--line)}
.drow.tot{font-weight:600}
.drow .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .dv{font-family:var(--font-mono);text-align:right}
.drow .dn{font:11px var(--font-mono);color:var(--muted);text-align:right;white-space:nowrap}
.dbar{position:relative;height:8px;background:var(--panel-2);border-radius:4px}
.dbar .f{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}
.dbar .f.st-watch{background:var(--warn)} .dbar .f.st-breach{background:var(--bad)} .dbar .f.st-soft{background:#e8935a}
.dbar .lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text)}
.dmore{color:var(--faint);font-size:12px;padding:6px 0}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.flist li{display:flex;gap:6px;align-items:baseline;white-space:normal}
.flist li b{font:500 10.5px var(--font-mono);color:var(--muted);min-width:46px}
.flist li span{margin-left:auto;font:11px var(--font-mono);color:var(--muted);white-space:nowrap}
.flist li.gap span{color:var(--bad)} .flist li.planned span{color:var(--accent)}
.cmx td.cm{cursor:pointer;white-space:nowrap}
.cmx td.cm:hover{background:var(--accent-dim)}
.cmx td.cm .cmv{display:block;font:11px var(--font-mono);color:var(--muted);margin-top:3px}
.cmx td.cm .cmv i{font-style:normal;color:var(--faint)}

/* Expand the example commitments with the security-master fields the chosen rules need */
function enrichCommitments(list){
  const R = rng(4242), pick = a => a[Math.floor(R()*a.length)];
  const SECT = ['Information Technology','Health Care','Industrials','Consumer Discretionary','Financials','Communication Services','Consumer Staples','Materials'];
  const TYPE = h => h.category==='Co-Investment' ? 'Co-Investment (Direct)' : h.category==='Separate Account' ? 'Credit Investment'
    : h.category==='Secondary' ? (h.structureType==='GP Led' ? 'Secondary – GP-Led / Continuation' : h.structureDetail==='Single Fund' ? 'Secondary – Single Fund LP Interest' : 'Secondary – Portfolio')
    : h.structureType==='Fund-of-Funds' ? 'Fund of Funds' : 'Primary Fund';
  list.forEach(h => {
    h.investmentType = TYPE(h);
    h.underlyingAsset = h.name;
    h.followOn = 'No';
    if(h.region==='North America'){ h.market = R()<0.9 ? 'US' : 'Non-US Developed'; h.geoFocus = h.market==='US' ? 'US' : 'Canada'; h.country = 'None'; }
    else if(h.region==='Western Europe'){ h.market = 'Non-US Developed'; h.geoFocus = 'Western Europe'; h.country = 'None'; }
    else { const em = R()<0.55; h.market = em ? 'Emerging Market' : 'Non-US Developed'; h.geoFocus = 'Asia-Pacific'; h.country = em ? (R()<0.55 ? 'China' : R()<0.5 ? 'India' : 'None') : (R()<0.4 ? 'Japan' : 'None'); }
    if(h.investmentType.startsWith('Co-Investment')) h.sector = pick(SECT);
    else if(h.strategy==='Venture Capital') h.sector = R()<0.6 ? 'Information Technology' : 'Health Care';
    else if(h.strategy==='Real Estate') h.sector = 'Real Estate';
    else if(h.strategy==='Infrastructure') h.sector = R()<0.5 ? 'Utilities' : 'Energy';
    else h.sector = 'Diversified';
    h.firstTime = isPrimary(h) && R()<0.1 ? 'Yes' : 'No';
    if(h.investmentType.startsWith('Co-Investment') || h.investmentType==='Credit Investment' || h.investmentType==='Secondary – Portfolio') h.fundSize = null;
    else if(h.firstTime==='Yes') h.fundSize = Math.round((250 + R()*350))*M;
    else if(h.investmentType.startsWith('Secondary – GP')) h.fundSize = Math.round(400 + R()*2200)*M;
    else h.fundSize = Math.round(Math.exp(Math.log(700) + R()*(Math.log(9000)-Math.log(700))))*M;
    h.ownership = h.fundSize ? Math.round(h.usd/h.fundSize*10000)/100 : null;
    h.currency = h.region==='Western Europe' ? (R()<0.7 ? 'EUR' : 'GBP') : 'USD';
    h.vintage = h.date.slice(0,4);
    h.tranche = h.date.slice(0,4)+' Allocation';
    h.relationship = R()<0.05 ? 'HL Managed' : R()<0.04 ? 'HL Affiliated' : 'Third Party';
    h.listed = 'No';
    h.fof = h.investmentType==='Fund of Funds' ? 'Yes' : 'No';
    const recent = h.date >= '2026-09-01';
    h.contractual = recent && R()<0.6 ? 'Pending' : 'Cleared';
    h.esg = recent && R()<0.5 ? 'Pending' : 'Compliant';
    h.qst2 = recent && R()<0.5 ? 'Pending' : 'Pass';
  });
  // A few deliberate exceptions so the example shows breaches as well as passes
  const coE = list.find(h => h.mandate==='ctr-co' && h.investmentType==='Co-Investment (Direct)' && h.date.startsWith('2025'));
  if(coE) coE.sector = 'Energy';
  const peSmall = list.find(h => h.mandate==='ctr-pe' && isPrimary(h) && h.date.startsWith('2025') && h.usd >= 40*M);
  if(peSmall){ peSmall.firstTime = 'Yes'; peSmall.fundSize = Math.round(peSmall.usd/0.118/M)*M; peSmall.ownership = Math.round(peSmall.usd/peSmall.fundSize*10000)/100; }
  const pcAff = list.find(h => h.mandate==='nmi-pc' && h.investmentType==='Credit Investment');
  if(pcAff) pcAff.relationship = 'HL Affiliated';
  return list;
}

  const t = tget(e, lens, node.key); if(!t) return null;
  if(t['usd'+suf]!=null) return t['usd'+suf];
  if(t['pct'+suf]!=null){ const b = baseUsd(e, lens, node); return b!=null ? b*t['pct'+suf]/100 : null; }
  return null;
}
function effPctK(e, lens, node, suf){
  if(node.depth===0) return suf==='' ? 100 : null;
  const t = tget(e, lens, node.key); if(!t) return null;
  if(t['pct'+suf]!=null) return t['pct'+suf];
  if(t['usd'+suf]!=null){ const b = baseUsd(e, lens, node); return b ? t['usd'+suf]/b*100 : null; }
  return null;
}
const effUsd = (e, lens, node) => effUsdK(e, lens, node, '');
const effPct = (e, lens, node) => effPctK(e, lens, node, '');
/* band = [min, target, max] for a measure, explicit or implied from the other measure */
function band(e, lens, node, k){

  return SUFS.map(suf => {
    const ex = t[k+suf];
    if(ex!=null && !(node.depth===0 && k==='pct')) return {v:ex, imp:false};
    if(k==='usd'){ const v = effUsdK(e, lens, node, suf); return {v, imp:v!=null}; }
    if(k==='pct'){ const v = effPctK(e, lens, node, suf); return {v, imp:v!=null && node.depth>0}; }
    return {v:null, imp:false};
  });
}
function bandStatus(a, lo, tg, hi){

  if(hi!=null && av > hi + 1e-9) return {cls:'above', text:'Above max'};
  if(tg!=null){ const r = tg ? av/tg : 1;
    if(Math.abs(r-1) <= 0.05) return {cls:'at', text:'At target'};
    if(lo!=null || hi!=null) return {cls:'in', text: r<1 ? 'In range · under target' : 'In range · over target'};
    return r < 1 ? {cls:'under', text: Math.round(r*100)+'% of target'} : {cls:'over', text:'Over target'}; }
  return {cls:'in', text:'In range'};
}
const STATUS_RANK = {above:5, below:4, over:3, under:2, in:1, at:1, none:0};
function countBelow(e, lens, node){ let c=0; node.children.forEach(ch => walk(ch, n => { if(hasT(tget(e,lens,n.key))) c++; })); return c; }

function countAll(e){ return LENS_KEYS.reduce((a,l) => a+countLens(e,l), 0); }
function childCheck(e, lens, node){

  node.children.forEach(ch => { const v = effUsd(e, lens, ch); if(v!=null){ S+=v; c++; } });
  if(P && c) out.push(pill('$', S/P, `Children total ${fmtUsd(S)} against ${fmtUsd(P)} at this level (${c} of ${node.children.length} children targeted)`));
  const Pn = node.depth===0 ? e.program.n : tget(e,lens,node.key)?.n; let Sn=0, cn=0;
  node.children.forEach(ch => { const t = tget(e,lens,ch.key); if(t?.n!=null){ Sn+=t.n; cn++; } });
  if(Pn && cn) out.push(pill('#', Sn/Pn, `Children total ${Sn} investments against ${Pn} at this level`, `${Sn}/${Pn}`));

function pill(sym, r, title, text){

function comparator(e, lens, node){

    const sl = kids(e); let S=0, c=0;
    sl.forEach(m => { const v = effUsd(m, lens, node); if(v!=null){ S+=v; c++; } });
    return c ? `${fmtUsd(S)} · ${c}/${sl.length}` : '<span style="color:var(--faint)">·</span>';
  }
  const p = ent(e.parent); if(!p) return '';
  if(node.depth>0 && !hasT(tget(p,lens,node.key))) return '<span style="color:var(--faint)">·</span>';
  const u = effUsd(p,lens,node), pc = effPct(p,lens,node), n = node.depth===0 ? p.program.n : tget(p,lens,node.key)?.n;
  return [u!=null?fmtUsd(u):null, node.depth>0&&pc!=null?fmtPct(pc):null, n!=null?n+'#':null].filter(Boolean).join(' · ');
}

/* ---------- Actuals (from holdings) ---------- */
function holdingsOf(e){
  if(e.kind==='client'){ const ids = new Set(kids(e).map(m => m.id)); return holdings.filter(h => ids.has(h.mandate)); }
  return holdings.filter(h => h.mandate===e.id);
}
function holdingKeys(h, lens){
  const seq = lens==='strategy' ? [h.category,h.assetClass,h.strategy,h.subStrategy] : lens==='region' ? [h.region,h.assetClass] : [h.category,h.structureType,h.structureDetail];

function actualMap(e, lens){

  return m;
}
function actualOf(e, lens, node, A, k){

}

  const sb = k==='pct' ? b.map(x => x.imp ? {v:null, imp:false} : x) : b;
  return {b: sb, hint: b, a, st: bandStatus(a, sb[0].v, sb[1].v, sb[2].v)};
}
function bandBar(k, a, b, st){

  const scale = Math.max(a||0, hi||0, tg||0, lo||0) * 1.12 || 1;
  const p = v => Math.max(0, Math.min(100, v/scale*100));
  const rng = lo!=null || hi!=null ? `<i class="rng" style="left:${p(lo??0).toFixed(1)}%;width:${(p(hi??scale)-p(lo??0)).toFixed(1)}%"></i>` : '';
  const tick = tg!=null ? `<i class="tg" style="left:calc(${p(tg).toFixed(1)}% - 1px)"></i>` : '';
  const bandTxt = lo!=null || hi!=null ? ` · range ${lo!=null?fmtM(k,lo):'…'} to ${hi!=null?fmtM(k,hi):'…'}` : '';
  const title = `Actual ${a!=null?fmtM(k,a):'none'}${k==='pct'?' of committed':''}${tg!=null?' · target '+fmtM(k,tg):''}${bandTxt} · ${st.text}`;
  return `<div class="band st-${st.cls}" title="${esc(title)}"><span class="trk">${rng}<i class="fill" style="width:${p(a||0).toFixed(1)}%"></i>${tick}</span><span class="av">${a!=null?fmtM(k,a):'—'}</span></div>`;

function worstStatus(e, lens, node, A){

/* ---------- Pacing ---------- */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthYr = d => MON[d.getMonth()]+' '+d.getFullYear();
const fmtDate = d => d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
const fmtX = v => v==null || !isFinite(v) ? '—' : v.toFixed(2)+'x';
function startOf(e){ const [y,m,d] = (e.pacing?.start || AS_OF_Y+'-01-01').split('-').map(Number); return new Date(y, m-1, d); }
function yearTarget(e, y){
  const st = startOf(e), y0 = st.getFullYear();
  if(y < y0) return 0;
  const o = e.pacing?.overrides?.[y]; if(o!=null) return o;
  const a = e.pacing?.annual || 0;
  if(y===y0){ const ye = new Date(y+1,0,1); return a * (ye-st) / (ye-new Date(y,0,1)); }
  return a;
}
function pacing(e){
  const st = startOf(e), y0 = st.getFullYear(), H = holdingsOf(e), D = {};
  H.forEach(h => { const y = +h.date.slice(0,4); const r = D[y] || (D[y] = {usd:0, n:0, by:{}}); r.usd += h.usd; r.n++; r.by[h.mandate] = (r.by[h.mandate]||0) + h.usd; });
  const first = Math.min(y0, ...Object.keys(D).map(Number));
  const rows = []; let cumT = 0, cumD = 0;
  for(let y = first; y <= AS_OF_Y + 2; y++){
    const t = yearTarget(e, y), d = D[y] || {usd:0, n:0, by:{}}, past = y <= AS_OF_Y;
    let tToDate = t;
    if(y===AS_OF_Y){ const from = y===y0 ? st : new Date(y,0,1), ye = new Date(y+1,0,1); tToDate = from > AS_OF ? 0 : t * (AS_OF-from) / (ye-from); }
    if(past){ cumT += tToDate; cumD += d.usd; }
    rows.push({y, t, tToDate: past ? tToDate : null, d: past ? d.usd : null, n: past ? d.n : null, by: d.by,
      cumT: past ? cumT : null, cumD: past ? cumD : null, future: !past, cur: y===AS_OF_Y, override: e.pacing?.overrides?.[y]!=null});
  }
  const cur = rows.find(r => r.cur);
  const ltmFrom = new Date(AS_OF - 365*864e5);
  const ltm = H.filter(h => new Date(h.date) > ltmFrom).reduce((s,h) => s+h.usd, 0);
  const remaining = e.program.usd!=null ? Math.max(0, e.program.usd - cumD) : null;
  return {rows, cur, start:st, cumD, cumT, ltm, remaining, nInv:H.length,
    ytdVel: cur && cur.tToDate ? cur.d / cur.tToDate : null,
    cumVel: cumT ? cumD / cumT : null,
    yrs: remaining!=null && ltm ? remaining / ltm : null};
}
function velClass(v){
  if(v==null || !isFinite(v)) return ['', 'No target'];
  if(v < 0.85) return ['bad', 'Behind'];
  if(v < 0.95) return ['warn', 'Slightly behind'];
  if(v <= 1.15) return ['ok', 'On pace'];

}
function ribbon(e){

    <div class="rb"><span class="k">Program</span><span class="v">${fmtUsd(e.program.usd) || '—'}</span><span class="s">${pctCommitted!=null ? Math.round(pctCommitted*100)+'% committed · ' : ''}since ${monthYr(P.start)}</span></div>

      <span class="s">${c && c.t ? Math.round(c.d/c.t*100)+'% of annual · '+fmtUsd(c.tToDate)+' expected to date' : 'No annual target set'}</span></div>

    ${(() => { const c = compCounts(e), b = c.breach, sb = c.soft; const cls = b ? 'bad' : sb ? 'warn' : c.watch ? 'warn' : 'ok';
      return `<div class="rb clk" data-tab="compliance" role="button" tabindex="0" title="Open the compliance tab"><span class="k">Compliance</span><span class="v ${cls}">${b||sb ? (b+sb)+' breach'+(b+sb>1?'es':'') : 'All within limits'}</span><span class="s">${c.total} rules · ${c.watch} watch · ${c.pending} pending${sb?' · '+sb+' soft':''}</span></div>`; })()}

  </div>`;

      holdings.push({id:'h'+(n++), mandate:r.m.id, name: d.tranches.length>1 ? `${d.name} – ${t.name}` : d.name, manager:d.manager, date, usd:Math.round(a),

function visibleRows(e, lens){
  const rows = [], q = ui.search.trim().toLowerCase();
  const matchBelow = n => { let m=false; n.children.forEach(c => walk(c, x => { if(x.name.toLowerCase().includes(q)) m=true; })); return m; };
  const rec = n => {
    const self = hasT(tget(e,lens,n.key)) || n.depth===0, below = countBelow(e,lens,n);
    if(ui.assignedOnly && !self && !below) return;
    if(q && n.depth>0 && !n.name.toLowerCase().includes(q) && !matchBelow(n)) return;
    rows.push(n);
    const open = q ? (n.depth===0 || matchBelow(n) || ui.expanded[lens].has(n.key)) : ui.assignedOnly ? (below>0 || ui.expanded[lens].has(n.key)) : ui.expanded[lens].has(n.key);
    if(open) n.children.forEach(rec);

  rec(TREES[lens]);

function isOpen(e, lens, n, rows){ const i = rows.indexOf(n); return !!(n.children.length && rows[i+1] && rows[i+1].parent===n); }

const SLEEVE_COLORS = ['#6aa5e0','#4fb286','#b99be6','#d9a441','#5fc4c4'];
function renderPacing(e){
  const P = pacing(e), sl = e.kind==='client' ? kids(e) : [], rows = P.rows;
  // Annual chart
  const W = 640, Hh = 230, pl = 52, pr = 12, pt = 14, pb = 26, iw = W-pl-pr, ih = Hh-pt-pb;
  const maxV = Math.max(1, ...rows.map(r => Math.max(r.t||0, r.d||0))) * 1.12;
  const step = niceStep(maxV/4), yMax = Math.ceil(maxV/step)*step, ys = v => pt + ih - v/yMax*ih;
  const slot = iw/rows.length, bw = Math.min(46, slot*0.55);
  let g = '';
  for(let v=0; v<=yMax+1; v+=step){ g += `<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${ys(v)+3.5}" text-anchor="end">${fmtUsd(v)}</text>`; }
  rows.forEach((r,i) => {
    const cx = pl + slot*i + slot/2, x = cx - bw/2;

      if(sl.length){ let acc = 0; sl.forEach((m,j) => { const v = r.by[m.id]||0; if(!v) return; g += `<rect x="${x}" y="${ys(acc+v)}" width="${bw}" height="${ys(acc)-ys(acc+v)}" fill="${SLEEVE_COLORS[j%5]}"><title>${esc(m.name)} ${r.y}: ${fmtUsd(v)}</title></rect>`; acc += v; }); }
      else if(r.d) g += `<rect x="${x}" y="${ys(r.d)}" width="${bw}" height="${ys(0)-ys(r.d)}" rx="2" fill="var(--accent)"><title>${r.y} deployed: ${fmtUsd(r.d)}</title></rect>`;
    }
    if(r.t) g += `<line x1="${x-6}" x2="${x+bw+6}" y1="${ys(r.t)}" y2="${ys(r.t)}" stroke="var(--text)" stroke-width="2" ${r.future?'stroke-dasharray="4 3" opacity=".6"':''}><title>${r.y} target: ${fmtUsd(r.t)}</title></line>`;
    if(r.cur && r.t) g += `<circle cx="${cx}" cy="${ys(r.tToDate)}" r="3.5" fill="var(--bg)" stroke="var(--warn)" stroke-width="2"><title>Expected by ${fmtDate(AS_OF)}: ${fmtUsd(r.tToDate)}</title></circle>`;
    g += `<text x="${cx}" y="${Hh-8}" text-anchor="middle" ${r.cur?'style="fill:var(--text)"':''}>${r.y}${r.cur?' YTD':''}</text>`;
  });
  const annual = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Annual deployment against target by year">${g}</svg>`;
  // Cumulative chart
  const past = rows.filter(r => !r.future), W2 = 420, pl2 = 52;
  const cmax = Math.max(1, e.program.usd||0, ...past.map(r => Math.max(r.cumD, r.cumT))) * 1.08;
  const st2 = niceStep(cmax/4), y2Max = Math.ceil(cmax/st2)*st2, y2 = v => pt + ih - v/y2Max*ih;
  const x2 = i => pl2 + (past.length>1 ? i*(W2-pl2-pr)/(past.length-1) : (W2-pl2-pr)/2);
  let c = '';
  for(let v=0; v<=y2Max+1; v+=st2){ c += `<line x1="${pl2}" x2="${W2-pr}" y1="${y2(v)}" y2="${y2(v)}" stroke="var(--line)"/><text x="${pl2-6}" y="${y2(v)+3.5}" text-anchor="end">${fmtUsd(v)}</text>`; }
  if(e.program.usd) c += `<line x1="${pl2}" x2="${W2-pr}" y1="${y2(e.program.usd)}" y2="${y2(e.program.usd)}" stroke="var(--muted)" stroke-dasharray="2 4"/><text x="${pl2+4}" y="${y2(e.program.usd)-5}">Program ${fmtUsd(e.program.usd)}</text>`;
  const line = (k, col, dash) => `<polyline fill="none" stroke="${col}" stroke-width="2" ${dash?'stroke-dasharray="5 4"':''} points="${past.map((r,i)=>x2(i)+','+y2(r[k])).join(' ')}"/>`;
  c += `<polygon fill="var(--accent-dim)" points="${x2(0)},${y2(0)} ${past.map((r,i)=>x2(i)+','+y2(r.cumD)).join(' ')} ${x2(past.length-1)},${y2(0)}"/>`;
  c += line('cumT','var(--muted)',true) + line('cumD','var(--accent)',false);
  const lp = past[past.length-1];
  if(lp) c += `<circle cx="${x2(past.length-1)}" cy="${y2(lp.cumD)}" r="4" fill="var(--accent)"/><text x="${x2(past.length-1)-6}" y="${y2(lp.cumD)-8}" text-anchor="end" style="fill:var(--text)">${fmtUsd(lp.cumD)}</text>`;
  past.forEach((r,i) => c += `<text x="${x2(i)}" y="${Hh-8}" text-anchor="middle">${r.y}</text>`);
  const cumul = `<svg viewBox="0 0 ${W2} ${Hh}" role="img" aria-label="Cumulative deployment against cumulative target">${c}</svg>`;
  const lg = sl.length ? sl.map((m,j)=>`<span><i style="background:${SLEEVE_COLORS[j%5]}"></i>${esc(m.name)}</span>`).join('') : `<span><i style="background:var(--accent)"></i>Deployed</span>`;
  // Table
  const trs = rows.map(r => { const [vc] = velClass(r.cur ? (r.tToDate ? r.d/r.tToDate : null) : (r.t ? r.d/r.t : null));
    const vsT = r.future ? '' : r.t ? `<span class="pill ${vc==='bad'?'over':vc==='warn'?'under':'ok'}">${Math.round(r.d/r.t*100)}%</span>` : '—';

      <td class="num">${r.future?'':fmtUsd(r.d)||'$0'}</td><td class="num">${r.future?'':r.n}</td>
      <td class="num">${vsT}</td>
      <td class="num">${r.cur?fmtUsd(r.tToDate)+' · '+fmtX(r.tToDate?r.d/r.tToDate:null):''}</td>
      <td class="num">${r.future?'':fmtUsd(r.cumT)||'$0'}</td><td class="num">${r.future?'':fmtUsd(r.cumD)||'$0'}</td>
      <td class="num">${r.future?'':fmtX(r.cumT?r.cumD/r.cumT:null)}</td>
      ${sl.map(m => `<td class="num">${r.future?'':fmtUsd(r.by[m.id]||0)}</td>`).join('')}
    </tr>`; }).join('');
  return `<div class="pane">
    <div class="setbar">
      <label class="field" for="pStart">${e.kind==='client'?'Program start':'Mandate start'}<input type="date" id="pStart" value="${e.pacing.start}"></label>
      <label class="field" for="pEnd">Investment period end<input type="date" id="pEnd" value="${endOf(e).toISOString().slice(0,10)}"></label>
      <label class="field" for="pAnnual">Annual deployment target<input id="pAnnual" value="${fmtUsd(e.pacing.annual)}" placeholder="e.g. 150M"></label>
      <span class="lbl" style="max-width:56ch">The first year is prorated from the start date. Type a figure in any year's target to override it. Pacing is measured as of ${fmtDate(AS_OF)}${e.kind==='client'?'; deployment is the total across this client’s sleeves':''}.</span>
    </div>
    <div class="charts">
      <div class="chartcard"><h4>Annual deployment vs target</h4><p>Bars are commitments by investment year; white ticks are the yearly target, and the ring is where ${AS_OF_Y} should be today.</p>${annual}<div class="lg">${lg}<span><i style="background:var(--text);height:2px"></i>Target</span></div></div>
      <div class="chartcard"><h4>Cumulative deployment</h4><p>Committed since inception against the cumulative time-weighted target.</p>${cumul}<div class="lg"><span><i style="background:var(--accent)"></i>Deployed</span><span><i style="background:var(--muted);height:2px"></i>Target to date</span></div></div>
    </div>

      <tbody>${trs}</tbody>

function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw||1))), f = raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

function ruleForCommitment(x, h, m){
  const {r, L, o} = x, d = o.dims.find(d => d.ids.includes(h.id)), req = requirementText(r), prog = m.program.usd || 0;
  const brk = r.severity==='Soft' ? 'soft' : 'breach';
  switch(L.type){
    case 'groupShare': case 'groupAmt':
      return d ? {st:d.st, text:`${esc(d.label)} totals ${fmtU(o.unit, d.val)} <i>${req}</i>`} : {st:'na', text:'Not in scope for this rule'};
    case 'perInv':
      return d ? {st:d.st, text:`${fmtU(L.unit, d.val)} <i>${req}</i>`} : {st:'na', text:'Can’t be measured: '+(L.unit==='pct' ? 'no underlying fund size' : 'no amount')};
    case 'bucket': {
      const inB = L.pred(h, r);
      return inB ? {st:o.status, text:`Counts in the bucket · adds ${fmtPct(prog ? h.usd/prog*100 : 0)} to ${fmtPct(o.value)} <i>${req}</i>`} : {st:'pass', text:'Outside this bucket'}; }
    case 'count':
      return L.pred(h) ? {st:o.status, text:`Counted · ${o.value} in total <i>${req}</i>`} : {st:'pass', text:'Not counted'};
    case 'alloc':
      return d ? {st:d.st, text:`${esc(d.label)} is ${fmtPct(d.val)} used <i>${req}</i>`} : {st:'na', text:'No allocation for this year'};
    case 'elig':
      return L.pred(h, r) ? {st:brk, text:`Fails the screen · ${esc(h.sector && L.list ? h.sector : L.dim)}`} : {st:'pass', text:'Passes the screen'};
    case 'attest': {
      const v = L.val(h);
      return {st: L.ok.includes(v) ? 'pass' : L.pend.includes(v) ? 'pending' : brk, text:`Response: ${esc(v ?? 'none')}`}; }
    case 'bands':
      return {st:o.status, text:`Tested on the mandate’s ${LENSES[L.lens].label.toLowerCase()} bands · ${esc(resultText(x))}`};
  }
  return {st:'na', text:''};
}
function fieldValue(fid, h){

  if(fid==='ECO01' || fid==='ECO03' || fid==='ECO08') return fmtUsd(v);
  if(fid==='ECO09') return fmtPct(v);
  return esc(v);
}

function renderHoldings(e){

  const H = ui.hold, all = holdingsOf(e), years = [...new Set(all.map(h => h.date.slice(0,4)))].sort().reverse();
  const q = H.q.trim().toLowerCase(), sm = H.cols==='sm', client = e.kind==='client';
  const flags = {}; (client ? kids(e) : [e]).forEach(m => Object.assign(flags, hitMap(m)));

  const chip = (lens, path, v) => v ? `<button class="chip" data-jump="${lens}|${esc(path.join(SEP))}" title="Open ${esc(path.join(SEP))} in the ${LENSES[lens].label} targets">${esc(v)}</button>` : '<span class="chip na">n/a</span>';

  const smv = (h, k) => { const v = h[k];
    if(k==='fundSize') return v ? fmtUsd(v) : '<span class="muted">n/a</span>';

  const tagCols = h => `<td>${chip('strategy',[h.category],h.category)}</td>
    <td>${chip('strategy',[h.category,h.assetClass],h.assetClass)}</td>

    </div>
    <div class="gridwrap"><table class="tbl htbl">
      <thead><tr>${th('name','Commitment')}${client?th('mandate','Mandate'):''}${th('date','Commit date',1)}${th('usd','Commitment',1)}${head}${th('flags','Compliance',0,'Rules on the mandate that flag this commitment')}</tr></thead>

function renderSide(){
  const e = cur(), SIDE_A = Object.fromEntries(LENS_KEYS.map(l => [l, actualMap(e,l)]));
  let h = `<h2>Assigned targets</h2>`;
  LENS_KEYS.forEach(l => {
    const items = [];
    walk(TREES[l], n => { if(n.depth && (hasT(tget(e,l,n.key)) || countBelow(e,l,n))) items.push(n); });
    const nT = countLens(e,l);
    h += `<section class="grp"><button class="gh" data-tab="${l}" title="Open the ${LENSES[l].label} targets"><span>${LENSES[l].label}</span><small>${nT} target${nT===1?'':'s'}</small></button>
      <div class="gpath">${LENSES[l].path}</div>`;
    if(!items.length) h += `<div class="none">No targets yet</div>`;
    items.forEach(n => {
      const t = tget(e,l,n.key), set = hasT(t);
      let v = '', rg = '', dot = '';
      if(set){
        const eu = effUsd(e,l,n), ep = effPct(e,l,n);
        v = [ t.usd!=null ? `<em>${fmtUsd(t.usd)}</em>` : eu!=null ? '≈'+fmtUsd(eu) : null,
              t.pct!=null ? `<em>${fmtPct(t.pct)}</em>` : ep!=null ? '≈'+fmtPct(ep) : null,
              t.n!=null ? `<em>${t.n}#</em>` : null ].filter(Boolean).join(' ');
        rg = MEAS.map(m => { const lo = t[m.k+'Min'], hi = t[m.k+'Max']; if(lo==null && hi==null) return null;
          const f = x => x==null ? '…' : m.k==='n' ? x : fmtM(m.k, x); return `${f(lo)}–${f(hi)}${m.k==='n'?'#':''}`; }).filter(Boolean).join(' · ');
        const ws = worstStatus(e, l, n, SIDE_A[l]);
        dot = `<i class="sdot st-${ws.cls}" title="${ws.text}"></i>`;
      } else v = '<span class="nt">no target</span>';
      h += `<button class="srow ${set?'':'ctx'} d${n.depth}" data-jump="${esc(l)}|${esc(n.key)}" title="${esc(n.key)}" style="--ind:${(n.depth-1)*14}px">
        <span class="l"><b>${dot}${esc(n.name)}</b><span class="vals">${v}</span></span>${rg?`<span class="rgl">range ${rg}</span>`:''}</button>`;
    });
    h += `</section>`;
  });
  h += `<div class="legend"><div><span class="pill ok">$ 100%</span> next level adds up</div><div><span class="pill under">$ 85%</span> next level is under</div><div><span class="pill over">$ 105%</span> next level is over</div><div>Dots show the worst band status on the row: <span class=\"sdot st-in\"></span>in range <span class=\"sdot st-below\"></span>below min <span class=\"sdot st-above\"></span>above max <span class=\"sdot st-under\"></span>building to target.</div><div>Values with ≈ are implied from the other measure. Muted rows have no target of their own but hold targets below.</div></div>`;
  $('#side').innerHTML = h;
}

          <td>${esc(e.name)}</td><td class="num">${fmtUsd(e.program.usd)||'—'}</td><td class="num">${e.program.n??'—'}</td>

          ${(() => { const P = pacing(e), [vc,vl] = velClass(P.ytdVel), [cc] = velClass(P.cumVel); return `<td>${monthYr(P.start)}</td><td class="num">${fmtUsd(e.pacing.annual)||'—'}</td><td class="num">${fmtUsd(P.cur?.d||0)}</td><td><span class="vtag ${vc}">${fmtX(P.ytdVel)} · ${vl}</span></td><td class="num"><span class="v ${cc}">${fmtX(P.cumVel)}</span></td>`; })()}
          <td>${(() => { const c = compCounts(e); return c.total ? (c.breach ? stPill('breach', c.breach) : '') + (c.soft ? stPill('soft', c.soft) : '') + (c.watch ? stPill('watch', c.watch) : '') + (!c.breach && !c.soft && !c.watch ? stPill('pass', c.pass) : '') : '<span class="muted">No rules</span>'; })()}</td>
          ${LENS_KEYS.map(l => { const c = countLens(e,l); return `<td><span class="covbar"><i style="width:${Math.round(c/maxCount*60)}px"></i>${c||'–'}</span></td>`; }).join('')}

/* ---------- Editing ---------- */
function commit(input){
  const tr = input.closest('tr'), key = tr.dataset.key, col = input.dataset.col, m = col.replace(/(Min|Max)$/,'');
  const e = cur(), lens = ui.lens, root = key==='';
  const r = parseVal(m, input.value);
  if(!r.ok){ input.classList.add('err'); toast(m==='usd'?'Enter a dollar amount like 250, 250M or 1.2B':m==='pct'?'Enter a percent like 12.5':'Enter a whole number of investments'); return false; }
  const obj = root ? e.program : (tget(e,lens,key) || {});
  if((obj[col]??null) === r.v){ input.classList.remove('err'); return 'same'; }
  const next = Object.assign({}, obj); if(r.v==null) delete next[col]; else next[col] = r.v;
  if(next[m+'Min']!=null && next[m+'Max']!=null && next[m+'Min'] > next[m+'Max']){ input.classList.add('err'); toast('Min can’t be above max'); return false; }
  input.classList.remove('err');
  snapshot();
  if(root) e.program = next;
  else if(hasT(next)) e.targets[lens][key] = next; else delete e.targets[lens][key];
  save(); return true;
}
function rerenderKeepFocus(key, col){
  const sc = $('#gridwrap')?.scrollTop;
  render();
  if($('#gridwrap') && sc!=null) $('#gridwrap').scrollTop = sc;
  if(key!=null && col){ const el = document.querySelector(`tr[data-key="${CSS.escape(key)}"] input[data-col="${col}"]`); if(el){ el.focus(); el.select(); } }
}
function moveRow(input, dir){
  const rows = [...document.querySelectorAll('#tbody tr')], i = rows.indexOf(input.closest('tr')), nxt = rows[i+dir];
  return nxt ? nxt.dataset.key : null;
}

document.addEventListener('focusout', ev => {
  const input = ev.target;
  if(!input.matches || !input.matches('input.cell') || input.dataset.skip) return;
  const res = commit(input);
  if(res===true){
    const rt = ev.relatedTarget, k = rt?.closest?.('tr')?.dataset.key, c = rt?.dataset?.col;
    rerenderKeepFocus(rt && rt.matches('input.cell') ? k : null, c);
  }
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if(t.matches && t.matches('.rb[data-tab], tr.hrow, tr.drow2') && (ev.key==='Enter' || ev.key===' ')){ ev.preventDefault(); t.click(); return; }
  if(ui.hold.detail && ui.tab==='holdings' && !(t.matches && t.matches('input,select,textarea'))){ if(ev.key==='Escape'){ ui.hold.detail=null; render(); return; } if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ document.querySelector(`[data-hnav="${ev.key==='ArrowRight'?1:-1}"]`)?.click(); return; } }
  if(t.matches && t.matches('input.cell')){
    if(ev.key==='Enter' || ev.key==='ArrowDown' || ev.key==='ArrowUp'){
      ev.preventDefault();
      const dir = ev.key==='ArrowUp' || (ev.key==='Enter' && ev.shiftKey) ? -1 : 1;
      const nk = moveRow(t, dir), col = t.dataset.col;
      t.dataset.skip = '1';
      const res = commit(t);
      if(res===false){ delete t.dataset.skip; return; }
      rerenderKeepFocus(nk ?? t.closest('tr').dataset.key, col);
    } else if(ev.key==='Escape'){
      t.dataset.skip='1'; rerenderKeepFocus(t.closest('tr').dataset.key, t.dataset.col);
    } else if(ev.key==='Delete' && t.selectionStart===0 && t.selectionEnd===t.value.length){
      t.value='';
    }
    return;
  }
  if(t.matches && t.matches('.chev') && (ev.key==='ArrowRight'||ev.key==='ArrowLeft')){
    const key = t.closest('tr').dataset.key, s = ui.expanded[ui.lens];
    ev.key==='ArrowRight' ? s.add(key) : s.delete(key); render();
    document.querySelector(`tr[data-key="${CSS.escape(key)}"] .chev`)?.focus();
  }
  if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==='z' && !(t.matches && t.matches('input'))){ ev.preventDefault(); undo(); }
});

document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-open], td[data-go], th[data-sort], td[data-cgo], .rb[data-tab], tr[data-hid], .drow[data-hid], td[data-pcell], tr[data-pdeal], tr[data-psel]'); if(!t) return;
  if(t.id==='vEdit'){ ui.view='edit'; render(); return; }
  if(t.id==='vOv'){ ui.view='overview'; render(); return; }
  if(t.id==='vPipe'){ ui.view='pipeline'; render(); return; }
  if(t.dataset.pcell!=null){ ui.pipe.cell = ui.pipe.cell===t.dataset.pcell ? null : t.dataset.pcell; render(); return; }
  if(t.id==='pAttn' || t.id==='pAttnTile'){ ui.pipe.attn = !ui.pipe.attn; render(); return; }
  if(t.dataset.pgroup){ ui.pipe.group = t.dataset.pgroup; render(); return; }
  if(t.dataset.ptgl){ const s = ui.pipe.collapsed; s.has(t.dataset.ptgl) ? s.delete(t.dataset.ptgl) : s.add(t.dataset.ptgl); render(); return; }
  if(t.id==='pExpand'){ ui.pipe.collapsed.clear(); render(); return; }
  if(t.id==='pCollapse'){ entities.filter(e => e.kind==='client').forEach(c => ui.pipe.collapsed.add(c.id)); render(); return; }
  if(t.dataset.pexcl){ const d = deals.find(x => x.id===ui.pipe.deal), id = t.dataset.pexcl; snapshot(); d.alloc.excl = d.alloc.excl.includes(id) ? d.alloc.excl.filter(x => x!==id) : [...d.alloc.excl, id]; delete d.alloc.ov[id]; save(); render(); return; }
  if(t.id==='pReset'){ const d = deals.find(x => x.id===ui.pipe.deal); snapshot(); d.alloc = {ov:{}, excl:[]}; save(); render(); toast('Allocation reset to the sharing ratios'); return; }
  if(t.id==='pClear'){ const d = deals.find(x => x.id===ui.pipe.deal); snapshot(); d.alloc.ov = {}; save(); render(); toast('Overrides cleared'); return; }
  if(t.id==='pCommit'){ const d = deals.find(x => x.id===ui.pipe.deal), A = runAllocation(d), n = A.rows.filter(r => r.total>0).length, un = A.un.reduce((s,v)=>s+v,0), over = A.rows.filter(r => r.overCap).length;
    modal(`<form><h3>Commit ${esc(d.name)}?</h3><p style="margin:0;color:var(--muted)">This books ${fmtUsd(A.allocated)} as original commitments across ${n} sleeve${n===1?'':'s'}, dated ${fmtDate(AS_OF)}, and moves the deal to Closed. Pacing, targets and compliance update straight away.${un>0.5*M?` ${fmtUsd(un)} of our hold stays unallocated.`:''}${over?` <b style="color:var(--bad)">${over} sleeve${over>1?'s are':' is'} over a compliance limit because of overrides.</b>`:''} You can undo this.</p>
      <div class="foot"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary">Commit allocation</button></div></form>`,
      () => { snapshot(); const k = commitDeal(d); save(); render(); toast(`${k} commitments booked · open a sleeve’s Commitments tab to see them`); });
    return; }
  if(t.dataset.pdeal && !t.matches('button')){ ui.pipe.deal = t.dataset.pdeal; ui.pipe.selM = null; render(); document.querySelector('.agrid-s')?.scrollIntoView({block:'start', behavior:'smooth'}); return; }
  if(t.dataset.psel && !ev.target.closest('input,button')){ ui.pipe.selM = t.dataset.psel; render(); return; }
  if(t.id==='undoBtn'){ undo(); return; }
  if(t.id==='resetBtn'){ openReset(); return; }
  if(t.id==='exportBtn'){ exportCsv(); return; }
  if(t.id==='addSleeve'){ openAddSleeve(); return; }
  if(t.id==='copyFrom'){ openCopy(); return; }
  if(t.id==='expandAll'){ walk(TREES[ui.lens], n => { if(n.children.length) ui.expanded[ui.lens].add(n.key); }); render(); return; }
  if(t.id==='collapseAll'){ ui.expanded[ui.lens] = new Set(['']); render(); return; }
  if(t.dataset.ent){ ui.hold.detail = null; ui.sel = t.dataset.ent; ui.view='edit'; render(); return; }
  if(t.dataset.open){ ui.sel = t.dataset.open; ui.view='edit'; render(); return; }
  if(t.dataset.go){ const [id,l,k] = t.dataset.go.split('|'); ui.sel=id; ui.view='edit'; jump(l,k); return; }
  if(t.dataset.tab){ ui.tab = t.dataset.tab; if(LENS_KEYS.includes(ui.tab)) ui.lens = ui.tab; render(); return; }
  if(t.dataset.sort){ const H = ui.hold; if(H.sort===t.dataset.sort) H.dir *= -1; else { H.sort = t.dataset.sort; H.dir = t.dataset.sort==='usd'||t.dataset.sort==='date' ? -1 : 1; } render(); return; }
  if(t.id==='copyHold'){ copyHoldings(); return; }
  if(t.id==='copyPlan'){ copyFieldPlan(); return; }
  if(t.hasAttribute('data-hback')){ ui.hold.detail = null; render(); $('#gridwrap')?.focus(); return; }
  if(t.dataset.hnav){ const l = ui.hold.list||[], i = l.indexOf(ui.hold.detail) + +t.dataset.hnav; if(l[i]){ ui.hold.detail = l[i]; render(); } return; }
  if(t.dataset.hid && !t.matches('button')){ const h = holdings.find(x => x.id===t.dataset.hid); if(!h) return;
    if(!holdingsOf(cur()).includes(h)) ui.sel = h.mandate;
    if(ui.tab!=='holdings') ui.hold.list = holdingsOf(cur()).map(x => x.id);
    ui.tab = 'holdings'; ui.view = 'edit'; ui.hold.detail = h.id; render(); document.querySelector('#main .pane')?.scrollTo(0,0); return; }
  if(t.dataset.hcols){ ui.hold.cols = t.dataset.hcols; render(); return; }
  if(t.dataset.cfilter!=null){ ui.comp.status = ui.comp.status===t.dataset.cfilter ? '' : t.dataset.cfilter; render(); return; }
  if(t.dataset.copen){ const s = ui.comp.open; s.has(t.dataset.copen) ? s.delete(t.dataset.copen) : s.add(t.dataset.copen); render(); return; }
  if(t.dataset.csev){ const r = cur().rules.find(x => x.id===t.dataset.csev); snapshot(); r.severity = r.severity==='Soft' ? 'Hard' : 'Soft'; save(); render(); return; }
  if(t.dataset.cdel){ const e = cur(), r = e.rules.find(x => x.id===t.dataset.cdel); snapshot(); e.rules = e.rules.filter(x => x!==r); ui.comp.sel.delete(r.id); save(); render(); toast(RULE_LIB[r.lib].wb+' removed · Undo to restore'); return; }
  if(t.dataset.plan){ const id = t.dataset.plan; snapshot(); masterPlan.has(id) ? masterPlan.delete(id) : masterPlan.add(id); save(); render(); toast(masterPlan.has(id) ? id+' added to the security master plan' : id+' removed from the plan'); return; }
  if(t.hasAttribute('data-cclear')){ ui.comp.sel.clear(); render(); return; }
  if(t.dataset.cgo){ const [mid, rid] = t.dataset.cgo.split('|'); ui.sel = mid; ui.tab = 'compliance'; ui.comp.open.add(rid); render(); return; }
  if(t.dataset.basis){ const e=cur(); if(e.basis!==t.dataset.basis){ snapshot(); e.basis=t.dataset.basis; save(); render(); toast(e.basis==='parent'?'% targets now read as a share of the level above':'% targets now read as a share of the total program'); } return; }
  if(t.dataset.jump){ const i = t.dataset.jump.indexOf('|'); jump(t.dataset.jump.slice(0,i), t.dataset.jump.slice(i+1)); return; }
  if(t.hasAttribute('data-toggle')){ const key=t.closest('tr').dataset.key, s=ui.expanded[ui.lens]; s.has(key)&&t.getAttribute('aria-expanded')==='true' ? s.delete(key) : s.add(key); render(); document.querySelector(`tr[data-key="${CSS.escape(key)}"] .chev`)?.focus(); return; }
  if(t.hasAttribute('data-clear')){ const key=t.closest('tr').dataset.key; snapshot(); delete cur().targets[ui.lens][key]; save(); render(); toast('Targets cleared on '+NODES[ui.lens][key].name+' · Undo to restore'); return; }
});
document.addEventListener('input', ev => {
  if(ev.target.classList && ev.target.classList.contains('pslide')){ const n = ev.target.closest('th').querySelector('.phold'); if(n) n.value = (+ev.target.value).toFixed(2); return; }
  if(ev.target.id==='pq'){ ui.pipe.q = ev.target.value; const pos = ev.target.selectionStart; render(); const s = $('#pq'); if(s){ s.focus(); s.setSelectionRange(pos,pos); } return; }
  if(ev.target.id==='search' || ev.target.id==='hq'){ const id = ev.target.id; if(id==='search') ui.search = ev.target.value; else ui.hold.q = ev.target.value;
    const pos = ev.target.selectionStart; render(); const s=$('#'+id); if(s){ s.focus(); s.setSelectionRange(pos,pos); } }
});
document.addEventListener('change', ev => {
  if(ev.target.id==='assignedOnly'){ ui.assignedOnly = ev.target.checked; render(); }
  if(ev.target.id==='ovLens'){ ui.ov.lens = ev.target.value; ui.ov.depth = 1; render(); }
  if(ev.target.id==='ovDepth'){ ui.ov.depth = +ev.target.value; render(); }
  if(ev.target.id==='ovMeasure'){ ui.ov.measure = ev.target.value; render(); }
  if(ev.target.dataset.csel){ const s = ui.comp.sel, id = ev.target.dataset.csel; ev.target.checked ? s.add(id) : s.delete(id); render(); return; }
  if(ev.target.id==='allFields'){ ui.comp.allFields = ev.target.checked; render(); return; }
  if(ev.target.id==='addRule' && ev.target.value){ const e = cur(), lib = ev.target.value; snapshot(); const n = Math.max(0, ...entities.flatMap(x => (x.rules||[]).map(r => +r.id.slice(1)))) + 1;
    const r = Object.assign({id:'r'+n, lib, severity:'Hard'}, defaultsFor(lib)); (e.rules = e.rules || []).push(r); ui.comp.open.add(r.id); save(); render(); toast(RULE_LIB[lib].wb+' added with the rule book default'); return; }
  if(ev.target.classList.contains('rin')){ const e = cur(), r = e.rules.find(x => x.id===ev.target.dataset.rule), p = ev.target.dataset.p, L = RULE_LIB[r.lib];
    let v;
    if(p==='list') v = ev.target.value.split(',').map(x => x.trim()).filter(Boolean);
    else { const u = p==='limit' ? (L.type==='groupAmt' || L.unit==='usd' ? 'usd' : 'pct') : 'n'; const pr = parseVal(u, ev.target.value); if(!pr.ok){ ev.target.classList.add('err'); toast('That limit isn’t a number I can read'); return; } v = pr.v; }
    snapshot(); r[p] = v; save(); render(); return; }
  if(ev.target.id==='hYear'){ ui.hold.year = ev.target.value; render(); }
  if(ev.target.id==='hGroup'){ ui.hold.group = ev.target.value; render(); }
  if(ev.target.id==='pShowAll'){ ui.pipe.showAll = ev.target.checked; render(); return; }
  if(ev.target.classList.contains('phold') || ev.target.classList.contains('pslide')){ const d = deals.find(x => x.id===ui.pipe.deal), ti = +ev.target.dataset.tr, v = parseFloat(ev.target.value);
    if(isNaN(v) || v<0){ ev.target.classList.add('err'); toast('Enter the hold in $M, like 35'); return; }
    snapshot(); d.tranches[ti].amt = Math.min(v*M, d.tranches[ti].of); save(); render(); return; }
  if(ev.target.classList.contains('pov')){ const d = deals.find(x => x.id===ui.pipe.deal), mid = ev.target.dataset.m, ti = +ev.target.dataset.tr, raw = ev.target.value.trim();
    snapshot(); const o = d.alloc.ov[mid] = d.alloc.ov[mid] || {};
    if(raw===''){ delete o[ti]; } else { const v = parseFloat(raw.replace(/[$,]/g,'')); if(isNaN(v) || v<0){ undoStack.pop(); ev.target.classList.add('err'); toast('Enter an amount in $M, or clear it to go back to the engine'); return; } o[ti] = v*M; }
    if(!Object.keys(o).length) delete d.alloc.ov[mid];
    ui.pipe.selM = mid; save(); render(); return; }
  if(ev.target.id==='pEnd'){ if(!ev.target.value){ render(); return; } snapshot(); cur().pacing.end = ev.target.value; save(); render(); toast('Investment period end updated · used for remaining duration in allocations'); }
  if(ev.target.id==='pStart'){ if(!ev.target.value){ render(); return; } snapshot(); cur().pacing.start = ev.target.value; save(); render(); toast('Start date updated'); }
  if(ev.target.id==='pAnnual' || ev.target.dataset.yr){
    const r = parseVal('usd', ev.target.value), e = cur();
    if(!r.ok){ ev.target.classList.add('err'); toast('Enter a dollar amount like 150, 150M or 1.2B'); return; }
    snapshot();
    if(ev.target.id==='pAnnual') e.pacing.annual = r.v ?? 0;
    else { const y = ev.target.dataset.yr; e.pacing.overrides = e.pacing.overrides || {}; if(r.v==null) delete e.pacing.overrides[y]; else e.pacing.overrides[y] = r.v; }
    save(); render();
  }
});

function jump(lens, key){
  ui.lens = lens; ui.tab = lens; ui.view = 'edit'; ui.search=''; const n = NODES[lens][key];
  let p = n.parent; while(p){ ui.expanded[lens].add(p.key); p = p.parent; }
  render();
  const tr = document.querySelector(`tr[data-key="${CSS.escape(key)}"]`);
  if(tr){ tr.scrollIntoView({block:'center'}); tr.classList.add('flash'); tr.querySelector('input[data-col="usd"]').focus(); }
}

/* ---------- Modals ---------- */
function modal(html, onOk){
  $('#modal').innerHTML = html; $('#scrim').classList.add('open');
  const close = () => $('#scrim').classList.remove('open');
  $('#modal').querySelector('[data-cancel]').onclick = close;
  $('#modal').querySelector('form').onsubmit = ev => { ev.preventDefault(); if(onOk(new FormData(ev.target))!==false) close(); };
  $('#scrim').onclick = ev => { if(ev.target.id==='scrim') close(); };
  $('#modal').onkeydown = ev => { if(ev.key==='Escape') close(); };
  setTimeout(() => $('#modal').querySelector('input,select')?.focus(), 0);
}
function openAddSleeve(){
  const clients = entities.filter(e=>e.kind==='client');
  const def = cur().kind==='client' ? cur().id : cur().parent;
  modal(`<form><h3>Add mandate sleeve</h3>
    <label>Client<select name="client" id="m-client">${clients.map(c=>`<option value="${c.id}" ${c.id===def?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
    <label>Sleeve name<input name="name" id="m-name" required placeholder="e.g. Real Assets Sleeve"></label>
    <div class="row"><label>Program ($M)<input name="usd" id="m-usd" placeholder="250"></label><label>Investments<input name="n" id="m-n" placeholder="12"></label></div>
    <div class="row"><label>Start date<input type="date" name="start" id="m-start" value="${AS_OF_Y}-01-01"></label><label>Annual deployment ($M)<input name="annual" id="m-annual" placeholder="60"></label></div>
    <label>% basis<select name="basis" id="m-basis"><option value="program">Share of total program</option><option value="parent">Share of the level above</option></select></label>
    <div class="foot"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary">Add sleeve</button></div></form>`,
  fd => {
    const u = parseVal('usd', fd.get('usd')), n = parseVal('n', fd.get('n')), an = parseVal('usd', fd.get('annual'));
    if(!u.ok||!n.ok||!an.ok){ toast('Program must be a dollar amount and investments a whole number'); return false; }
    snapshot();
    const id = 'm'+Date.now().toString(36);
    const e = {id, name:fd.get('name').trim(), kind:'mandate', parent:fd.get('client'), basis:fd.get('basis'), program:{usd:u.v, n:n.v}, pacing:{start:fd.get('start')||(AS_OF_Y+'-01-01'), annual:an.v||0, overrides:{}}, targets:{strategy:{},region:{},structure:{}}};
    const lastIdx = entities.map(x=>x.id===e.parent||x.parent===e.parent).lastIndexOf(true);
    entities.splice(lastIdx+1, 0, e); save(); ui.sel=id; ui.view='edit'; render(); toast('Sleeve added');
  });
}
function openCopy(){
  const e = cur(), others = entities.filter(x=>x.id!==e.id);
  modal(`<form><h3>Copy targets into ${esc(e.name)}</h3>
    <label>Copy from<select name="src" id="c-src">${others.map(o=>`<option value="${o.id}">${esc(o.name)}${o.kind==='mandate'?' ('+esc(ent(o.parent).name)+')':''}</option>`).join('')}</select></label>
    <div class="checks">${LENS_KEYS.map(l=>`<label><input type="checkbox" name="lens" value="${l}" checked> ${LENSES[l].label}</label>`).join('')}</div>
    <label>When a level already has a target<select name="mode" id="c-mode"><option value="merge">Keep this mandate’s target</option><option value="overwrite">Replace with the copied target</option><option value="replace">Clear this mandate’s targets first</option></select></label>
    <div class="foot"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary">Copy targets</button></div></form>`,
  fd => {
    const src = ent(fd.get('src')), lenses = fd.getAll('lens'), mode = fd.get('mode'); let c=0;
    if(!lenses.length){ toast('Pick at least one hierarchy'); return false; }
    snapshot();
    lenses.forEach(l => {
      if(mode==='replace') e.targets[l] = {};
      Object.entries(src.targets[l]).forEach(([k,t]) => { if(mode==='merge' && hasT(e.targets[l][k])) return; e.targets[l][k] = {...t}; c++; });
    });
    save(); render(); toast(`${c} targets copied from ${src.name}`);
  });
}
function openReset(){
  modal(`<form><h3>Reset to the example data?</h3><p style="margin:0;color:var(--muted)">This replaces every client, sleeve, target, pacing setting, commitment and compliance rule in this browser with the example set. You can undo it afterwards.</p>
    <div class="foot"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary">Reset</button></div></form>`,
  () => { snapshot(); loadData(seedAll()); ui.sel = entities[1].id; save(); render(); toast('Example data restored'); });
}
function exportCsv(){
  const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
  const lines = [['Client','Mandate','% Basis','Hierarchy','Level','Path','$ Min','$ Target','$ Max','# Min','# Target','# Max','% Min','% Target','% Max','Effective $'].join(',')];
  entities.forEach(e => {
    const client = e.kind==='client' ? e.name : ent(e.parent).name, mand = e.kind==='client' ? '(client macro)' : e.name;
    const P = e.program; lines.push([q(client),q(mand),q(e.basis),q('Program'),q('Total'),q(''),P.usdMin??'',P.usd??'',P.usdMax??'',P.nMin??'',P.n??'',P.nMax??'','','100','',P.usd??''].join(','));
    LENS_KEYS.forEach(l => walk(TREES[l], n => { const t = tget(e,l,n.key); if(n.depth && hasT(t)){
      lines.push([q(client),q(mand),q(e.basis),q(LENSES[l].label),q(LENSES[l].path.split(' › ')[n.depth-1]),q(n.key),...['usd','n','pct'].flatMap(k => SUFS.map(sf => t[k+sf]??'')),Math.round(effUsd(e,l,n)??0)||''].join(','));
    }}));
  });
  const csv = lines.join('\n');
  navigator.clipboard.writeText(csv).then(() => toast(`Copied ${lines.length-1} rows as CSV · paste into Excel`), () => {
    modal(`<form><h3>Targets as CSV</h3><textarea id="csvOut" style="height:220px;background:var(--bg);color:var(--text);border:1px solid var(--line-2);border-radius:6px;font:11px var(--font-mono)">${esc(csv)}</textarea>
      <div class="foot"><button type="button" class="btn ghost" data-cancel>Close</button><button class="btn primary">Done</button></div></form>`, () => {});
    setTimeout(()=>{ const t=$('#csvOut'); t.focus(); t.select(); },0);
  });
}
function copyHoldings(){
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`, e = cur();
  const lines = [['Client','Mandate','Commitment','Commit date','Investment year','Commitment amount','Category','Asset Class','Strategy','Sub-Strategy','Region','Structure Type','Structure Detail',...SM_COLS.map(([k,f]) => f+' '+(FIELD_BY_ID[f]?.name||k))].join(',')];
  holdingsOf(e).forEach(h => { const m = ent(h.mandate), c = ent(m.parent);
    lines.push([q(c?.name),q(m.name),q(h.name),h.date,h.date.slice(0,4),h.usd,q(h.category),q(h.assetClass),q(h.strategy),q(h.subStrategy),q(h.region),q(h.structureType),q(h.structureDetail),...SM_COLS.map(([k]) => q(h[k]))].join(',')); });
  const csv = lines.join('\n');
  navigator.clipboard.writeText(csv).then(() => toast(`Copied ${lines.length-1} commitments as CSV`), () => {
    modal(`<form><h3>Commitments as CSV</h3><textarea id="csvOut" style="height:220px;background:var(--bg);color:var(--text);border:1px solid var(--line-2);border-radius:6px;font:11px var(--font-mono)">${esc(csv)}</textarea>
      <div class="foot"><button type="button" class="btn ghost" data-cancel>Close</button><button class="btn primary">Done</button></div></form>`, () => {});
  });
}
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

render();
</script>
</body>
</html>
