name: Deploy staging

# Deploys the staging branch once CI has passed on it, and can be run by hand
# from the Actions tab for any branch. Staging is its own pair of workers
# (tapestrai-web-staging, tapestrai-api-staging) on its own Supabase project, so
# a change can be tried on real infrastructure before it reaches master.
#
# The values come from the GitHub environment "staging" (Settings, Environments):
#   secrets  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   vars     NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#            NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_GRAPHQL_ENDPOINT
# Worker secrets (the service role key, model keys, ERROR_REPORT_DSN) are set
# once with `wrangler secret put <NAME> --env staging`. Migrations are applied to
# the staging project by hand, before deploying (docs/ENVIRONMENTS.md).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and deploy the web app
        working-directory: apps/web
        run: npm run cf:deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
          ERROR_REPORT_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy the GraphQL API
        working-directory: apps/api
        run: npm run deploy:staging -- --var ERROR_REPORT_RELEASE:${{ github.event.workflow_run.head_sha || github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
