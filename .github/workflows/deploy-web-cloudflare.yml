name: Deploy web to Cloudflare

# Deploys master once CI has passed on it, and can still be run by hand from the
# Actions tab. It deploys the exact commit CI tested, never a newer one. Building
# happens on Linux because the OpenNext bundler needs symlinks, which Windows
# blocks without Developer Mode.
#
# Database migrations are not applied here. A change whose app needs a new
# migration must have it applied before merging (docs/MIGRATIONS.md); a
# migration that removes what the deployed app calls is applied after.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # By hand, or after CI succeeded on a push to master (not on a pull request).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI passed on. A manual run deploys the branch it was started from.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and deploy
        working-directory: apps/web
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Public values are baked into the client bundle at build time.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
