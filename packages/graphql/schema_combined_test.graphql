# File: common.graphql
# Scalar Types
scalar Date
scalar DateTime
scalar JSON
scalar UUID

# Enums
enum DomainType {
  FUND
  ISSUER
  DEAL
  SECURITY
  PRICE
  POSITION
}

enum SourceType {
  VENDOR
  INTERNAL
  MANUAL
  CALCULATED
}

enum PositionType {
  EQUITY
  DEBT
  FUND_INTEREST
  DERIVATIVE
  OTHER
}

enum DQRuleType {
  COMPLETENESS
  VALIDITY
  CONSISTENCY
  TIMELINESS
  UNIQUENESS
}

enum DQSeverity {
  CRITICAL
  HIGH
  MEDIUM
  LOW
}

enum DQExceptionStatus {
  OPEN
  IN_REVIEW
  RESOLVED
  WAIVED
  FALSE_POSITIVE
}

# Common Types
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

type MutationError {
  field: String
  message: String!
  code: String!
}

# Temporal Types
type TemporalValue {
  value: String
  validFrom: Date!
  validTo: Date!
  systemFrom: DateTime!
  systemTo: DateTime!
  source: String!
  isOverride: Boolean!
}

type SourceValue {
  source: String!
  sourceName: String!
  value: String
  precedenceRank: Int!
  validFrom: Date!
  validTo: Date!
  confidenceScore: Float
  receivedAt: DateTime
}

type FieldLineage {
  attributeCode: String!
  attributeName: String!
  currentValue: String
  competingValues: [SourceValue!]!
  resolutionRule: String
  lastUpdated: DateTime!
}

# Attribute Definition with Derived Attribute Support
type AttributeDefinition {
  id: ID!
  attributeCode: String!
  attributeName: String!
  dataType: String!
  description: String
  unitOfMeasure: String
  isRequired: Boolean!
  isMultiValued: Boolean!
  referenceDomainCode: String
  defaultPrecedenceRank: Int!
  
  # Derived attribute fields
  isDerived: Boolean!
  derivationType: String
  derivationFormula: String
  derivationDependencies: [String!]
  formulaLanguage: String
}

# Derivation evaluation result
type DerivationResult {
  attributeCode: String!
  value: JSON
  derivationType: String!
  dependencies: [String!]!
  evaluatedAt: DateTime!
}

# File: dataquality.graphql
# Data Quality Types

type DQRule {
  id: ID!
  ruleCode: String!
  ruleName: String!
  domainCode: DomainType
  attributeCode: String
  ruleType: DQRuleType!
  severity: DQSeverity!
  "SQL predicate that is true when a record fails this rule."
  ruleExpression: String!
  ruleDescription: String
  thresholdValue: Float
  isActive: Boolean!
  autoRemediate: Boolean!
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DQException {
  id: ID!
  ruleId: ID!
  rule: DQRule!
  entityId: ID!
  entityCode: String!
  entityName: String!
  domainCode: DomainType!
  attributeId: ID
  attributeCode: String
  attributeName: String
  
  # Exception Details
  exceptionType: String!
  exceptionMessage: String!
  expectedValue: String
  actualValue: String
  severity: DQSeverity!
  
  # Status
  status: DQExceptionStatus!
  assignedTo: String
  assignedToUser: String
  resolvedAt: DateTime
  resolvedBy: String
  resolutionNotes: String
  
  # Temporal
  detectedAt: DateTime!
  validFrom: Date!
  validTo: Date!
  
  # Metadata
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DQExceptionConnection {
  edges: [DQExceptionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DQExceptionEdge {
  node: DQException!
  cursor: String!
}

input DQRuleFilter {
  ruleCode: StringFilter
  ruleName: StringFilter
  domainCode: DomainType
  ruleType: DQRuleType
  severity: DQSeverity
  isActive: Boolean
}

input DQExceptionFilter {
  ruleId: IDFilter
  entityId: IDFilter
  entityCode: StringFilter
  domainCode: DomainType
  attributeCode: StringFilter
  exceptionType: StringFilter
  severity: DQSeverity
  status: DQExceptionStatus
  assignedTo: StringFilter
  detectedAtRange: DateRangeFilter
}

input CreateDQRuleInput {
  ruleCode: String!
  ruleName: String!
  domainCode: DomainType
  attributeCode: String
  ruleType: DQRuleType!
  severity: DQSeverity!
  "SQL predicate that is true when a record fails this rule."
  ruleExpression: String!
  ruleDescription: String
  thresholdValue: Float
  autoRemediate: Boolean
}

input UpdateDQRuleInput {
  id: ID!
  ruleName: String
  "SQL predicate that is true when a record fails this rule."
  ruleExpression: String
  ruleDescription: String
  thresholdValue: Float
  isActive: Boolean
  autoRemediate: Boolean
}

input ResolveDQExceptionInput {
  exceptionId: ID!
  status: DQExceptionStatus!
  resolutionNotes: String
}

type CreateDQRuleResult {
  rule: DQRule
  errors: [MutationError!]!
}

type UpdateDQRuleResult {
  rule: DQRule
  errors: [MutationError!]!
}

type ResolveDQExceptionResult {
  success: Boolean!
  errors: [MutationError!]!
}

