# Fund Domain Types

type Fund {
  id: ID!
  entityCode: String!
  entityName: String!
  description: String
  isActive: Boolean!
  templateId: ID
  
  # Core Attributes
  nav: Float
  navCurrency: String
  navDate: Date
  inceptionDate: Date
  fundStatus: String
  fundType: String
  manager: String
  aum: Float
  expenseRatio: Float
  domicile: String
  legalStructure: String
  
  # Source Tracking
  navSource: String
  lastUpdated: DateTime
  
  # Lineage
  lineage: [FieldLineage!]
  
  # Metadata
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String
  updatedBy: String
}

type FundConnection {
  edges: [FundEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type FundEdge {
  node: Fund!
  cursor: String!
}

input FundFilter {
  entityCode: StringFilter
  entityName: StringFilter
  fundStatus: StringFilter
  fundType: StringFilter
  manager: StringFilter
  domicile: StringFilter
  navRange: FloatRangeFilter
  aumRange: FloatRangeFilter
  navDateRange: DateRangeFilter
  inceptionDateRange: DateRangeFilter
  isActive: Boolean
}

input CreateFundInput {
  entityCode: String!
  entityName: String!
  description: String
  templateId: ID
  attributes: [AttributeInput!]
}

input UpdateFundInput {
  id: ID!
  entityName: String
  description: String
  isActive: Boolean
  attributes: [AttributeInput!]
}

type CreateFundResult {
  fund: Fund
  errors: [MutationError!]!
}

type UpdateFundResult {
  fund: Fund
  errors: [MutationError!]!
}
