  entityName: String!
  domainCode: String!
  attributeCode: String!
  attributeName: String!
  overrideValue: String!
  overrideReason: String
  prioritySourceCode: String
  prioritySourceName: String
  priorityValue: String
  ready: Boolean!
}

type QualityEntityRef {
  id: ID!
  entityCode: String!
  entityName: String!
  domainCode: String!
}

type AvailabilityEntity {
