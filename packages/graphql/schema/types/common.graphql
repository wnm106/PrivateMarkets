# Scalar Types
scalar Date
scalar DateTime
scalar JSON
scalar UUID

# Enums
enum DomainType {
  FUND
  ISSUER
  DEAL
  SECURITY
  PRICE
  POSITION
}

enum SourceType {
  VENDOR
  INTERNAL
  MANUAL
  CALCULATED
}

enum PositionType {
  EQUITY
  DEBT
  FUND_INTEREST
  DERIVATIVE
  OTHER
}

enum DQRuleType {
  COMPLETENESS
  VALIDITY
  CONSISTENCY
  TIMELINESS
  UNIQUENESS
}

enum DQSeverity {
  CRITICAL
  HIGH
  MEDIUM
  LOW
}

enum DQExceptionStatus {
  OPEN
  IN_REVIEW
  RESOLVED
  WAIVED
  FALSE_POSITIVE
}

# Common Types
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

type MutationError {
  field: String
  message: String!
  code: String!
}

# Temporal Types
type TemporalValue {
  value: String
  validFrom: Date!
  validTo: Date!
  systemFrom: DateTime!
  systemTo: DateTime!
  source: String!
  isOverride: Boolean!
}

type SourceValue {
  source: String!
  sourceName: String!
  value: String
  precedenceRank: Int!
  validFrom: Date!
  validTo: Date!
  confidenceScore: Float
  receivedAt: DateTime
}

type FieldLineage {
  attributeCode: String!
  attributeName: String!
  currentValue: String
  competingValues: [SourceValue!]!
  resolutionRule: String
  lastUpdated: DateTime!
  # True while a materialized calc that owns this attribute is waiting to be recomputed.
  calcDirty: Boolean!
}

# One recorded write of an attribute value, newest first in entityActivity.
type AttributeActivity {
  attributeCode: String!
  attributeName: String!
  value: String
  updatedAt: DateTime!
  updatedBy: String!
  sourceName: String
  validFrom: Date!
  validTo: Date!
}

# Attribute Definition with Derived Attribute Support
type AttributeDefinition {
  id: ID!
  attributeCode: String!
  attributeName: String!
  dataType: String!
  description: String
  unitOfMeasure: String
  isRequired: Boolean!
  isMultiValued: Boolean!
  referenceDomainCode: String
  domainCode: String
  clientId: ID
  clientName: String
  defaultPrecedenceRank: Int!
  
  # Derived attribute fields
  isDerived: Boolean!
  derivationType: String
  derivationFormula: String
  derivationDependencies: [String!]
  formulaLanguage: String

  # Time dimension fields
  isTimeVarying: Boolean!
  timeDimension: String

  # Display and validation metadata
  displayFormat: String
  listValues: [String!]
  validationRules: JSON
  defaultValue: String
  displaySection: String
  displayGroup: Int
  # Width and height on the 4-column attribute display. Both default to 1.
  displaySpanColumns: Int
  displaySpanRows: Int
  isEditable: Boolean!
  isVisible: Boolean!
  
  # Reference list link
  referenceListCode: String
  referenceList: ReferenceList
  
  # Aggregation and precision
  aggregationType: String
  weightAttributeCode: String
  numericPrecision: Int

  # Global source sequence. Templates override this only when they set their own chain.
  defaultPrecedenceChain: [String!]!
}

# Derivation evaluation result
type DerivationResult {
  attributeCode: String!
  value: JSON
  derivationType: String!
  dependencies: [String!]!
  evaluatedAt: DateTime!
}

type CalcInput {
  inputRole: String!
  attributeCode: String!
  traversal: String!
  relationshipCodes: [String!]!
}

type CalcDefinition {
  id: ID!
  attributeCode: String!
  domainCode: String!
  calcKind: String!
  evaluationMode: String!
  timeImpact: String!
  outputGrain: String!
  expression: JSON
  aggregateFn: String
  seriesFn: String
  derivationDependencies: [String!]!
  inputs: [CalcInput!]!
}

type CalcComponent {
  attributeCode: String!
  attributeName: String!
  role: String!
  traversal: String!
  relationshipCodes: [String!]!
  relationshipNames: [String!]!
  domainCode: String
  domainName: String
  homeDomainCode: String
  homeDomainName: String
  entityId: ID
  entityCode: String
  entityName: String
  value: String
  detail: String
  calculated: Boolean!
}

type CalcBreakdown {
  attributeCode: String!
  calcKind: String!
  domainCode: String!
  expression: JSON
  value: String
  truncated: Boolean!
  components: [CalcComponent!]!
}

input CalcOperandInput {
  attributeCode: String!
  traversal: String!
  relationshipCodes: [String!]!
}

type CalculatedAttributeState {
  entityId: ID!
  attributeCode: String!
  dirty: Boolean!
  status: String
  windowStart: Date
  windowEnd: Date
}

type ProcessCalculatedAttributesResult {
  processed: Int!
  failed: Int!
  pending: Int!
}

type UpdateCalcExpressionResult {
  definition: CalcDefinition
  errors: [MutationError!]!
}

type ExpressionFunction {
  id: ID!
  code: String!
  name: String!
  category: String!
  returnType: String!
  description: String!
  signature: String!
  example: JSON!
  callable: Boolean!
}
