# Issuer Domain Types

type Issuer {
  id: ID!
  entityCode: String!
  entityName: String!
  description: String
  isActive: Boolean!
  templateId: ID
  
  # Core Attributes
  lei: String
  country: String
  sector: String
  industry: String
  subIndustry: String
  marketCap: Float
  marketCapCurrency: String
  creditRating: String
  ratingAgency: String
  employeeCount: Int
  website: String
  foundedDate: Date
  isPublic: Boolean
  tickerSymbol: String
  exchange: String
  
  # Source Tracking
  lastUpdated: DateTime
  
  # Relationships
  securities: SecurityConnection
  
  # Lineage
  lineage: [FieldLineage!]
  
  # Metadata
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String
  updatedBy: String
}

type IssuerConnection {
  edges: [IssuerEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type IssuerEdge {
  node: Issuer!
  cursor: String!
}

input IssuerFilter {
  entityCode: StringFilter
  entityName: StringFilter
  country: StringFilter
  sector: StringFilter
  industry: StringFilter
  creditRating: StringFilter
  marketCapRange: FloatRangeFilter
  isPublic: Boolean
  isActive: Boolean
}

input CreateIssuerInput {
  entityCode: String!
  entityName: String!
  description: String
  templateId: ID
  attributes: [AttributeInput!]
}

input UpdateIssuerInput {
  id: ID!
  entityName: String
  description: String
  isActive: Boolean
  attributes: [AttributeInput!]
}

type CreateIssuerResult {
  issuer: Issuer
  errors: [MutationError!]!
}

type UpdateIssuerResult {
  issuer: Issuer
  errors: [MutationError!]!
}
