# Price Domain Types

type Price {
  id: ID!
  entityCode: String!
  entityName: String!
  description: String
  isActive: Boolean!
  templateId: ID
  
  # Core Attributes
  price: Float!
  priceDate: Date!
  priceTime: DateTime
  priceType: String
  currency: String!
  exchange: String
  bidPrice: Float
  askPrice: Float
  midPrice: Float
  lastTradePrice: Float
  openPrice: Float
  highPrice: Float
  lowPrice: Float
  volume: Float
  adjustedClosePrice: Float
  
  # Relationships
  security: Security
  securityId: ID
  
  # Source Tracking
  source: String
  confidenceScore: Float
  
  # Lineage
  lineage: [FieldLineage!]
  
  # Metadata
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String
  updatedBy: String
}

type PriceConnection {
  edges: [PriceEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PriceEdge {
  node: Price!
  cursor: String!
}

input PriceFilter {
  entityCode: StringFilter
  priceRange: FloatRangeFilter
  priceDateRange: DateRangeFilter
  priceType: StringFilter
  currency: StringFilter
  exchange: StringFilter
  securityId: IDFilter
  source: StringFilter
  isActive: Boolean
}

input CreatePriceInput {
  entityCode: String!
  entityName: String!
  securityId: ID!
  price: Float!
  priceDate: Date!
  currency: String!
  priceType: String
  attributes: [AttributeInput!]
}

input UpdatePriceInput {
  id: ID!
  price: Float
  priceDate: Date
  attributes: [AttributeInput!]
}

type CreatePriceResult {
  price: Price
  errors: [MutationError!]!
}

type UpdatePriceResult {
  price: Price
  errors: [MutationError!]!
}
