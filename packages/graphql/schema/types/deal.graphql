# Deal Domain Types

type Deal {
  id: ID!
  entityCode: String!
  entityName: String!
  description: String
  isActive: Boolean!
  templateId: ID
  
  # Core Attributes
  dealDate: Date
  dealType: String
  dealSubType: String
  dealValue: Float
  dealValueCurrency: String
  enterpriseValue: Float
  equityValue: Float
  debtValue: Float
  status: String
  closingDate: Date
  announcementDate: Date
  transactionStatus: String
  dealRole: String
  feePercentage: Float
  feeAmount: Float
  
  # Relationships
  issuer: Issuer
  issuerId: ID
  fund: Fund
  fundId: ID
  
  # Source Tracking
  lastUpdated: DateTime
  
  # Lineage
  lineage: [FieldLineage!]
  
  # Metadata
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String
  updatedBy: String
}

type DealConnection {
  edges: [DealEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DealEdge {
  node: Deal!
  cursor: String!
}

input DealFilter {
  entityCode: StringFilter
  entityName: StringFilter
  dealType: StringFilter
  dealSubType: StringFilter
  status: StringFilter
  transactionStatus: StringFilter
  dealValueRange: FloatRangeFilter
  dealDateRange: DateRangeFilter
  closingDateRange: DateRangeFilter
  issuerId: IDFilter
  fundId: IDFilter
  isActive: Boolean
}

input CreateDealInput {
  entityCode: String!
  entityName: String!
  description: String
  templateId: ID
  issuerId: ID
  fundId: ID
  attributes: [AttributeInput!]
}

input UpdateDealInput {
  id: ID!
  entityName: String
  description: String
  isActive: Boolean
  issuerId: ID
  fundId: ID
  attributes: [AttributeInput!]
}

type CreateDealResult {
  deal: Deal
  errors: [MutationError!]!
}

type UpdateDealResult {
  deal: Deal
  errors: [MutationError!]!
}
