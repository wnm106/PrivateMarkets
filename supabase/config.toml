# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "meridian-mdm"

[api]
enabled = true
port = 54321
# position_master was dropped by 20261031140000; an exposed schema that does not exist only causes errors.
schemas = ["public", "metadata_register", "entity_instances", "golden_master", "data_quality", "compliance", "read_projections", "tenancy"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/001_seed_data.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# An address must be confirmed before the session starts. Joining a client by
# email domain happens only on a confirmed address (tenancy.auto_join_client),
# so with confirmations off a sign-up never joins a client by domain.
# Set the same under Authentication -> Providers -> Email on the hosted project.
enable_confirmations = true
secure_password_change = true

# Second factor. Clients that require it (client_auth_requirements.mfa_required)
# and platform staff are held to it by the database, not only by the app.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = false

# Azure AD / Entra ID sign-in. Register ONE multi-tenant Azure App Registration
# (Supported account types: "Accounts in any organizational directory") so any
# client's own Azure AD tenant can be used to sign in; tenancy.handle_new_auth_user()
# then routes the user to the correct client via tenancy.client_identity_providers
# (matched on the Azure "tid" claim or verified email domain). Set the real values
# via env vars locally (.env) and via the Supabase Dashboard in production.
[auth.external.azure]
enabled = true
client_id = "env(AZURE_CLIENT_ID)"
secret = "env(AZURE_CLIENT_SECRET)"
# "common" allows sign-in from any Azure AD tenant (required for multi-tenant clients).
# A sign-in joins a client only when its directory (tid) is the one registered
# for that client; see tenancy.auto_join_client.
url = "https://login.microsoftonline.com/common/v2.0"
redirect_uri = ""

# Enforces tenancy.client_auth_requirements when a token is issued. A client that
# turns password off, or that only allows its own SAML / OIDC / Entra provider,
# is refused here. The same function is created by
# supabase/migrations/20261109180000_client_auth_requirements.sql.
# On a hosted project, also select this Postgres function under
# Authentication -> Hooks -> Customize Access Token.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/tenancy/custom_access_token_hook"

# Lets an outside assistant (a claude.ai connector) sign a person in and call
# /api/mcp as them: the Auth server acts as an OAuth 2.1 server. The person
# approves on the app's own page at authorization_url_path, which is joined to
# site_url. Dynamic registration lets the assistant register itself; without it,
# each one is added by hand under Authentication -> OAuth Apps.
# On a hosted project these are set under Authentication -> OAuth Server.
# See docs/API.md, "Remote MCP endpoint".
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[edge_runtime]
policy = "per_worker"

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Native/process runtime for machines without Docker, including Cloud Agent VMs.
# SUPABASE_EXPERIMENTAL_STACK=0 forces the Docker backend.
[experimental]
stack = true
