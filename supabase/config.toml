# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "meridian-mdm"

[api]
enabled = true
port = 54321
schemas = ["public", "metadata_register", "entity_instances", "golden_master", "position_master", "data_quality", "read_projections"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false

[edge_runtime]
policy = "per_worker"

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Native/process runtime for machines without Docker, including Cloud Agent VMs.
# SUPABASE_EXPERIMENTAL_STACK=0 forces the Docker backend.
[experimental]
stack = true
