# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "meridian-mdm"

[api]
enabled = true
port = 54321
schemas = ["public", "metadata_register", "entity_instances", "golden_master", "position_master", "data_quality", "compliance", "read_projections", "tenancy"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/001_seed_data.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false

# Azure AD / Entra ID sign-in. Register ONE multi-tenant Azure App Registration
# (Supported account types: "Accounts in any organizational directory") so any
# client's own Azure AD tenant can be used to sign in; tenancy.handle_new_auth_user()
# then routes the user to the correct client via tenancy.client_identity_providers
# (matched on the Azure "tid" claim or verified email domain). Set the real values
# via env vars locally (.env) and via the Supabase Dashboard in production.
[auth.external.azure]
enabled = true
client_id = "env(AZURE_CLIENT_ID)"
secret = "env(AZURE_CLIENT_SECRET)"
# "common" allows sign-in from any Azure AD tenant (required for multi-tenant clients).
url = "https://login.microsoftonline.com/common/v2.0"
redirect_uri = ""

[edge_runtime]
policy = "per_worker"

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Native/process runtime for machines without Docker, including Cloud Agent VMs.
# SUPABASE_EXPERIMENTAL_STACK=0 forces the Docker backend.
[experimental]
stack = true
